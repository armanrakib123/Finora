server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: banking-system

  # ===== Database Configuration =====
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-wild-dew-b5ns9830-pooler.c-7.us-east-2.aws.neon.tech:5432/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_4uZRjhp9MCIm}
    driver-class-name: org.postgresql.Driver

  # ===== SQL Initialization =====
  sql:
    init:
      mode: always
      continue-on-error: true

  # ===== JPA / Hibernate =====
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ===== Jackson (JSON serialization) =====
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

# ===== CORS Configuration =====
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://finora-eight-ivory.vercel.app,http://127.0.0.1:3000,http://localhost:4200}

  # ===== JWT Configuration =====
  jwt:
    secret: ${JWT_SECRET:ZmFudGFzdGljLXNlY3JldC1rZXktZm9yLWJhbmtpbmctc3lzdGVtLW11c3QtYmUtbG9uZy1hbmQtc2VjdXJlLWZvci1oczI1Ng==}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# ===== Logging =====
logging:
  level:
    com.banking: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
